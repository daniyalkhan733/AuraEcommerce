<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="row w-100 justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-5">
        <h2 class="fw-bold text-primary display-6">AuraEcom</h2>
        <p class="text-muted">Welcome back! Please login to your account.</p>
      </div>
      
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden glass">
        <div class="card-body p-4 p-md-5">
          <div *ngIf="errorMessage" class="alert alert-danger border-0 rounded-3 small py-2 mb-4 animate fadeIn">
            <i class="bi bi-exclamation-circle me-2"></i> {{ errorMessage }}
          </div>
          
          <form [formGroup]="loginForm" (ngSubmit)="login()" [ngClass]="{'shake': submitted && (loginForm.invalid || errorMessage)}">
            <div class="mb-4">
              <label for="email" class="form-label fw-semibold small text-uppercase">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="email" formControlName="email" class="form-control bg-light border-0 py-2"
                  placeholder="name@example.com"
                  [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
              </div>
              <div *ngIf="submitted && f['email'].errors" class="invalid-feedback d-block">
                <small *ngIf="f['email'].errors['required']">Email is required</small>
                <small *ngIf="f['email'].errors['email']">Enter a valid email path</small>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold small text-uppercase">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="password" formControlName="password" class="form-control bg-light border-0 py-2"
                  placeholder="••••••••"
                  [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
              </div>
              <div *ngIf="submitted && f['password'].errors" class="invalid-feedback d-block">
                <small *ngIf="f['password'].errors['required']">Password is required</small>
                <small *ngIf="f['password'].errors['minlength']">Minimum 6 characters</small>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              {{ isLoading ? 'Signing In...' : 'Sign In' }}
            </button>
          </form>

          <div class="mt-5 text-center">
            <p class="small text-muted mb-0">Don't have an account? <a href="#" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
          </div>
        </div>
      </div>
      
      <div class="mt-4 text-center">
        <p class="small text-muted">&copy; 2026 AuraEcom Inc. All rights reserved.</p>
      </div>
    </div>
  </div>
</div>
